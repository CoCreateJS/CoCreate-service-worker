<!doctype html>
<html lang="en" service-worker="./service-worker.js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Worker demo</title>
</head>
<body>
    <main>
        <h1>Service Worker demo</h1>
        <p>Set the service-worker attribute on an element to register the worker URL it contains. If no path is provided, /service-worker.js is used.</p>


        <p>This demo expects a service-worker.js file at the path in the service-worker attribute.</p>
    </main>
    <script src="../dist/CoCreate-service-worker.js"></script>
</body>
</html>
