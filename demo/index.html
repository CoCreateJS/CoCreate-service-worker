<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Worker demo</title>
</head>
<body>
    <main>
        <h1>Service Worker demo</h1>
        <p>The component registers the worker after the page loads. This demo configures a local worker path.</p>


        <p>The worker script must be served from the same origin as this page.</p>
    </main>
    <script>
        window.CoCreateConfig = { serviceWorker: "./service-worker.js", cache: "false" };
    </script>
    <script src="../dist/CoCreate-service-worker.js"></script>
</body>
</html>
