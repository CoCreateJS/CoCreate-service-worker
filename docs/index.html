<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Worker | CoCreateJS</title>
    <meta name="description" content="Service worker registration and lifecycle support for CoCreate.">
</head>
<body>
    <main>
        <h1>Service Worker</h1>
        <p>Set the service-worker attribute on an element to register the worker URL it contains. If no path is provided, /service-worker.js is used.</p>
        <h2>Usage</h2>
        <pre><code>&lt;html service-worker="/service-worker.js"&gt;</code></pre>
        <p><a href="/docs/service-worker/demo">Open the demo</a></p>
    </main>
</body>
</html>
